<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สแกน QR ครุภัณฑ์ - ระบบบริหารจัดการครุภัณฑ์</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/html5-qrcode" defer></script>
</head>
<body class="bg-slate-50 text-slate-800 flex h-screen overflow-hidden">

  <div id="sidebar-container"></div>

  <div class="flex-1 flex flex-col min-w-0 overflow-y-auto">
    <div id="header-container"></div>

    <main class="p-8 max-w-md w-full mx-auto pb-16 space-y-6">
      <div class="text-center space-y-1">
        <span class="inline-flex p-3 bg-emerald-50 rounded-2xl text-emerald-600 border border-emerald-200/80">
          <i class="ph-fill ph-qr-code text-2xl"></i>
        </span>
        <h2 class="text-xl font-bold text-slate-900">สแกน QR ครุภัณฑ์</h2>
        <p class="text-sm text-slate-500">เปิดกล้องสแกน QR ที่ติดอยู่บนตัวครุภัณฑ์ เพื่อดูข้อมูลทันที</p>
      </div>

      <div id="qr-reader" class="rounded-2xl overflow-hidden bg-black min-h-[280px] border border-slate-200"></div>
      <p id="scan-error" class="text-sm text-red-600 text-center hidden"></p>

      <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-5 space-y-3">
        <p class="text-sm font-medium text-slate-700">หรือกรอกเลขครุภัณฑ์ด้วยตนเอง</p>
        <form onsubmit="submitManualCode(event)" class="flex gap-2">
          <input id="manual-code-input" placeholder="เช่น DEMO-2569-001" class="flex-1 px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
          <button type="submit" class="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-medium transition">ค้นหา</button>
        </form>
      </div>
    </main>
  </div>

  <script src="js/supabase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/scan.js"></script>
</body>
</html>
