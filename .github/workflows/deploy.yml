name: Deploy to Vercel

# ทำงานทุกครั้งที่มีคน push เข้า branch main ไม่ว่าจะเป็นใครในทีมก็ตาม
# ใช้ Vercel Token แทนการเช็คสิทธิ์แบบ Git-based collaboration ของ Vercel เอง
# จึงไม่เจอ error "commit author ไม่มีสิทธิ์" หรือ "Deployment Blocked" อีก
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment (ดึง env vars จาก Vercel project มาใช้ตอน build)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
